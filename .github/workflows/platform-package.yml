# Platform package for mmkdigitalio/hackathon-platform-team (platform/operations/apps/affine/LIEFERANFORDERUNGEN.md):
# checks chart, smoke test and catalog entry on every PR, tests them end to end in kind, and on main
# publishes the chart and smoke image to GHCR plus a release that the platform's app-affine-sync.yml picks up.
name: platform-package

on:
  pull_request:
    branches: [main]
    paths: &paths
      - charts/**
      - smoke/**
      - runbook/**
      - platform-delivery/**
      - test/e2e-kind.sh
      - .github/workflows/platform-package.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORM_REPO: mmkdigitalio/hackathon-platform-team
  CHART_OCI: oci://ghcr.io/mmkdigitalio/charts
  SMOKE_IMAGE: ghcr.io/mmkdigitalio/affine-smoke

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PLATFORM_REPO }}
          path: .platform
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Chart (values contract, schema, fault value)
        run: |
          values=$(mktemp)
          yq '.values' platform-delivery/environments/staging/affine.yaml > "$values"
          platform='--set platform.persistentVolumeClaim=affine-data --set platform.replicas=1 --set rolloutMarker=ci --set imagePullSecretName=acr-pull'
          helm lint charts/affine -f "$values"
          # shellcheck disable=SC2086
          helm template affine charts/affine -n affine-staging -f "$values" $platform > /dev/null
          path=$(yq -r '.path | join(".")' platform-delivery/fault-invalid-config.yaml)
          value=$(yq -r '.value' platform-delivery/fault-invalid-config.yaml)
          # L11: the fault value must pass the chart schema
          # shellcheck disable=SC2086
          helm template affine charts/affine -f "$values" $platform --set-string "$path=$value" > /dev/null
      - name: Smoke test and scripts
        run: |
          node --check smoke/smoke.mjs
          shellcheck test/e2e-kind.sh
      - name: Catalog entry and desired state (platform validator)
        working-directory: .platform/platform/schemas/app-catalog
        run: |
          npm ci --no-audit --no-fund
          # A's conventions may not be on main yet; fall back to the validator's fixtures
          args=()
          [[ -f ../../schemas/conventions/conventions.json ]] || args+=(--conventions test/fixtures/conventions.json)
          [[ -f ../../schemas/foundation-outputs/foundation-outputs.schema.json ]] ||
            args+=(--foundation-outputs test/fixtures/foundation-outputs.schema.json)
          npx tsx src/cli.ts validate --tree "$GITHUB_WORKSPACE/platform-delivery" "${args[@]}"

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Chart and smoke test in kind (first run, persistence, fault value)
        run: test/e2e-kind.sh --fault

  publish:
    needs: e2e
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release with platform-release.json
      packages: write
    outputs:
      smoke-digest: ${{ steps.smoke.outputs.digest }}
      chart-version: ${{ steps.chart.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke image
        id: smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: smoke
          push: true
          tags: ${{ env.SMOKE_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(yq -r '.version' charts/affine/Chart.yaml)
          version="${base%.*}.${GITHUB_RUN_NUMBER}"
          helm package charts/affine --version "$version" -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/affine-${version}.tgz" "$CHART_OCI"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### AFFiNE platform package"
            echo "- Chart: \`$CHART_OCI/affine\` version \`$version\`"
            echo "- Smoke image: \`$SMOKE_IMAGE@${{ steps.smoke.outputs.digest }}\`"
            echo "- Runbook commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release for the platform
        # hackathon-platform-team's app-affine-sync.yml reads the latest release (no token needed, repo is
        # public), writes catalog entry and desired state to its main and starts app-deploy.yml.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.chart.outputs.version }}
          SMOKE: ${{ env.SMOKE_IMAGE }}@${{ steps.smoke.outputs.digest }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg chart "$VERSION" --arg smoke "$SMOKE" \
            '{sourceSha: $sha, chartVersion: $chart, smokeImage: $smoke}' > platform-release.json
          gh release create "package-$VERSION" platform-release.json --target "$GITHUB_SHA" --latest \
            --title "Platform package $VERSION" \
            --notes "Chart \`$CHART_OCI/affine:$VERSION\`, smoke image \`$SMOKE\`, runbook at \`$GITHUB_SHA\`."
